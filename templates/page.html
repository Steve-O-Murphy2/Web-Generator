<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>{{ title }}</h1>

            <p>
                <strong>Author:</strong> {{ author }}<br>
                <strong>Published:</strong> {{ date }}
            </p>

            <hr>
        </header>

        <main>
            {{ content | safe }}
        </main>

    </body>
</html>
